# Netlify publishes the site from the production context, since 19 October 2026 (launch step 9).
# Every other context builds a PREVIEW: it asks for a user name and password (basic authentication)
# and sends noindex. The build writes both rules to _site/_headers, the password from the
# BASIC_AUTH variable, which is set in Netlify for deploy previews, branch deploys and the dev
# server, never for production. No password is in this file or in the repository. A preview build
# on Netlify stops if BASIC_AUTH is missing, and a production build stops if it is set.
#
# Decision 68: only the production context publishes. Deploy previews and branch deploys stay
# previews, with the sign-in and noindex. The launch switch is SITE_ENV under
# [context.production.environment] below. Setting it back to "preview" alone does not take the
# site down: that production build stops without BASIC_AUTH and the published deploy stays up.
# Step 9 of docs/launch-dependencies.md gives the two ways to take it down.

[build]
  command = "npm test && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"
  SITE_ENV = "preview"
  # BASIC_AUTH is a secret in Netlify, and the build writes it to _site/_headers on purpose.
  # Netlify scans build output for secret values and fails the build when it finds one,
  # so that one file is left out of the scan.
  SECRETS_SCAN_OMIT_PATHS = "_site/_headers"

# The launch switch, "production" since 19 October 2026. It was "preview" until then, so that a
# merge could not publish the site by accident.
[context.production.environment]
  SITE_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Assets are not fingerprinted, so a browser must check with the server before reusing one, or a
# visitor can run an old script against a new page.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The rule comparison moved to /tools/compare/ on 20 October 2026 (decision 123). Netlify passes the
# query string on, so a copied link with its settings still opens the same result.
[[redirects]]
  from = "/reform-options/compare/"
  to = "/tools/compare/"
  status = 301
