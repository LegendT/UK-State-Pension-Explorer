# Netlify builds a PREVIEW in every context until launch. It is not the published site.
# A preview asks for a user name and password (basic authentication) and sends noindex. The build
# writes both rules to _site/_headers, the password from the BASIC_AUTH variable, which is set in
# Netlify and nowhere else. No password is in this file or in the repository. A preview build on
# Netlify stops if BASIC_AUTH is missing.
#
# Decision 68: at launch only the production context changes. Deploy previews and branch deploys
# stay previews, with the sign-in and noindex. The launch steps are in docs/launch-dependencies.md:
# set SITE_ENV to "production" under [context.production.environment] below, and scope BASIC_AUTH
# in Netlify to deploy previews and branch deploys. A production build stops while BASIC_AUTH is set.

[build]
  command = "npm test && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"
  SITE_ENV = "preview"
  # BASIC_AUTH is a secret in Netlify, and the build writes it to _site/_headers on purpose.
  # Netlify scans build output for secret values and fails the build when it finds one,
  # so that one file is left out of the scan.
  SECRETS_SCAN_OMIT_PATHS = "_site/_headers"

# The launch switch. "preview" until launch, so a merge cannot publish the site by accident.
[context.production.environment]
  SITE_ENV = "preview"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Assets are not fingerprinted, so a browser must check with the server before reusing one, or a
# visitor can run an old script against a new page.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
